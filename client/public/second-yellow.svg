<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 321" width="312" height="321" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
	<defs>
		<linearGradient id="lg" gradientTransform="rotate(60)">
			<stop stop-color="#fff" stop-opacity=".6" offset="0" />
