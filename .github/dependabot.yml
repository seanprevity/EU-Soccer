version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Ignore major version upgrades, do those manually - for later
    # ignore:
    #   - dependency-name: "*"
    #     update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  # Updates GitHub Actions, e.g. checkout@v5 -> checkout@v6
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: 
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"